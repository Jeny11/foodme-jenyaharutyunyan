ticket: KAN-7
sut: https://foodme-jenyaharutyunyan.onrender.com/
sources:
  doc: ""   # no docs/KAN-7-*.md in the repo; ACs copied from the Jira description
  jira: [KAN-7]
acs:
  - id: AC-1
    text: "On the checkout page, the customer can enter a promo code and press Apply."
    source: jira:KAN-7
  - id: AC-2
    text: "A valid code reduces the subtotal by the code's percentage. The discount and the new total are shown before the order is placed."
    source: jira:KAN-7
  - id: AC-3
    text: "A code works only if the subtotal is at least the code's minimum order amount. Otherwise the page shows \"Add {missing amount} AMD more to use this code\"."
    source: jira:KAN-7
  - id: AC-4
    text: "An expired code shows \"This code has expired\"."
    source: jira:KAN-7
  - id: AC-5
    text: "An unknown code shows \"Code not found\"."
    source: jira:KAN-7
  - id: AC-6
    text: "One code per order. Applying a second code replaces the first."
    source: jira:KAN-7
  - id: AC-7
    text: "The customer can remove the applied code, and the total goes back to the original."
    source: jira:KAN-7
launch_codes:   # reference data from the ticket's "Launch codes" table, word for word
  - { code: SAVE10, discount: "10%", minimum_order: "3,000 AMD", status: valid }
  - { code: TREAT15, discount: "15%", minimum_order: "8,000 AMD", status: valid }
  - { code: OLD15, discount: "15%", minimum_order: "none", status: expired }
out_of_scope:
  - "Free-delivery codes"
  - "Chef-specific codes"
  - "First-order-only codes"
questions:
  - id: Q-1
    about: [AC-2, AC-7]
    text: "AC-2 says \"A valid code reduces the subtotal by the code's percentage\" but also \"the new total are shown\". If checkout adds a delivery fee (or other charges), is the percentage taken from the items subtotal only, or from the whole total?"
    options:
      - "Discount = % of items subtotal only; total = discounted subtotal + delivery/fees"
      - "Discount = % of the full total including delivery/fees"
    answer: "Items subtotal only"
    answered_by: "Jeny11"
  - id: Q-2
    about: [AC-2]
    text: "AC-2 \"reduces the subtotal by the code's percentage\" doesn't say how fractional AMD is handled (e.g. 15% of 8,050 = 1,207.5 AMD). How should the discount be rounded?"
    options:
      - "Round half up to whole AMD (1,208)"
      - "Round down / truncate to whole AMD (1,207)"
      - "Keep decimals (1,207.50)"
    answer: "Keep decimals"
    answered_by: "Jeny11"
  - id: Q-3
    about: [AC-2, AC-3]
    text: "AC-3 says \"A code works only if the subtotal is at least the code's minimum order amount\", but nothing says what happens to an already applied code when the cart changes afterwards. If SAVE10 is applied at 3,000 AMD and an item is removed so the subtotal drops below 3,000, what should happen?"
    options:
      - "Discount is dropped and the \"Add {missing amount} AMD more to use this code\" message is shown"
      - "Code is removed silently; total returns to original"
      - "Discount stays applied (validated only at Apply time)"
      - "Discount is recalculated live, and order placement is blocked until minimum is met"
    answer: "Keep discount"
    answered_by: "Jeny11"
  - id: Q-4
    about: [AC-6]
    text: "AC-6 says \"Applying a second code replaces the first.\" If the second code is invalid (expired, unknown, or below minimum), does the first code stay applied?"
    options:
      - "First code stays applied; only the error for the second code is shown"
      - "First code is removed; the error is shown and no discount applies"
    answer: "First is removed"
    answered_by: "Jeny11"
  - id: Q-5
    about: [AC-1, AC-5]
    text: "The ACs never state how codes are matched. Should \"save10\" or \" SAVE10 \" (lowercase / surrounding spaces) be accepted as SAVE10, or show \"Code not found\"?"
    options:
      - "Case-insensitive and trimmed: both are accepted as SAVE10"
      - "Trimmed but case-sensitive: \" SAVE10 \" works, \"save10\" is \"Code not found\""
      - "Exact match only: both show \"Code not found\""
    answer: "Trim, case-sensitive"
    answered_by: "Jeny11"
  - id: Q-6
    about: [AC-3]
    text: "AC-3 shows \"Add {missing amount} AMD more to use this code\" but the number format isn't defined, while the launch-codes table writes amounts as \"3,000 AMD\". For a 2,000 AMD shortfall, what exact text should the tester expect?"
    options:
      - "\"Add 2,000 AMD more to use this code\" (thousands separator)"
      - "\"Add 2000 AMD more to use this code\" (plain integer)"
      - "Either format is acceptable; assert the number value only"
    answer: "\"Add 2000 AMD more\""
    answered_by: "Jeny11"
  - id: Q-7
    about: [AC-1]
    text: "The ACs don't say what happens when Apply is pressed with an empty promo field. What should the tester expect?"
    options:
      - "Apply button is disabled while the field is empty"
      - "Nothing happens / no request, no message"
      - "A validation message is shown (e.g. \"Code not found\" or \"Enter a code\")"
      - "Out of scope for this ticket: don't test"
    answer: "Apply disabled"
    answered_by: "Jeny11"
shared_setup: >-
  Signed in as a customer at https://foodme-jenyaharutyunyan.onrender.com/ with an empty cart and no promo code applied.
  Chef: Alans Kitchen (https://foodme-jenyaharutyunyan.onrender.com/chef/24), delivery 500 AMD, free delivery from 5,000 AMD.
  At checkout the delivery method is DELIVERY. Expected totals follow Q-1: total = subtotal - discount + delivery.
