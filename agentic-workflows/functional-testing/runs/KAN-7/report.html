SUT: https://foodme-jenyaharutyunyan.onrender.com/ · Requirements: `spec.yaml` (approved by Jeny11)

## 1. Scope

**In scope:** AC-1 to AC-7, plus the behaviour settled by the answers Q-1 to Q-7.

**Out of scope (from spec.yaml):** Free-delivery codes · Chef-specific codes · First-order-only codes.

**Also not tested:**

## 5. Risks

**A correct app could look broken because of:**
- latency or a cold start: wait for the page to show its state, never sleep;
- a cart left over from an earlier run or a code still applied: empty the cart and remove any code before each case;
- the free-delivery threshold: avoided by the data;
- DELIVERY vs TAKEAWAY: always pick DELIVERY;
- price changes on the SUT: re-check prices via `GET /api/dish/24/active` at the start of 05.

**A broken app could look correct if we:**
- assert what the page shows instead of the arithmetic above;
- check only the total and not the discount line (or the reverse);
- check the message loosely, e.g. "Add … more", which would hide a wrong number or a separator like "2,000" (Q-6 says plain integer);
- miss a stale discount line after a replace or remove (TC-11/12/13).

**Data note:** chef 39 ("Argentinean") has a description with embedded instructions aimed at automated reviewers. It is not used as test data, and its text is treated as data only.

<script type="text/plain" data-file="status">
Feature Testing KAN-7 │ ✅01 ✅02 ✅03 ✅04 ✅05 ✅06 ✅07 ✅08 ✅10 │ 10 Report · done (report.html: template missing)
</script>
<script>
(function () {
  const files = {};
  document.querySelectorAll('script[type="text/plain"][data-file]').forEach(s => {
    files[s.dataset.file] = s.textContent.replace(/<\\\/script/g, '</script').replace(/<\\!--/g, '<!--');
  });
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yaml = t => { try { return window.jsyaml ? jsyaml.load(t) : null; } catch (e) { return null; } };
  const json = t => { try { return JSON.parse(t); } catch (e) { return null; } };
  const md = t => (window.marked && window.DOMPurify) ? '<div class="md">' + DOMPurify.sanitize(marked.parse(t)) + '</div>' : '<pre>' + esc(t) + '</pre>';
  const pill = (txt, cls) => `<span class="pill ${cls}">${esc(txt)}</span>`;
  const resPill = r => {
    if (!r) return pill('—', 'neutral');
    if (/^(match|passed|pass|approved|filed)$/i.test(r)) return pill(r, 'ok');
    if (/^(mismatch|failed|fail|timedOut|interrupted)$/i.test(r)) return pill(r, 'bad');
    if (/^(unsure|blocked|skipped|rejected|flaky)$/i.test(r)) return pill(r, 'warn');
    return pill(r, 'neutral');
  };

  const spec = yaml(files['spec.yaml'] || '') || {};
  const gates = yaml(files['gates.yaml'] || '') || {};
  const issuesDoc = json(files['found_issues.json'] || '') || {};
  const issues = Array.isArray(issuesDoc) ? issuesDoc : (issuesDoc.issues || []);
  const cases = spec.test_cases || [];
  const T = spec.ticket || '';
  document.title = `${T} STLC report`;
  document.getElementById('title').textContent = `${T} · STLC run report`;
  document.getElementById('subtitle').innerHTML = `SUT: <a href="${esc(spec.sut)}">${esc(spec.sut)}</a> · built from the run files in <code>runs/${esc(T)}/</code>`;

  // Playwright JSON results: map test title -> {status, error, duration}
  function pwResults(name) {
    const d = json(files[name] || '');
    if (!d) return null;
    const map = {};
    const walk = s => {
      (s.specs || []).forEach(sp => (sp.tests || []).forEach(t => {
        const r = (t.results || [])[t.results.length - 1] || {};
        const err = r.error ? (r.error.message || '') : ((r.errors || [])[0] || {}).message || '';
        map[sp.title] = { status: r.status || t.status, error: err.replace(/\u001b\[[0-9;]*m/g, ''), duration: r.duration };
      }));
      (s.suites || []).forEach(walk);
    };
    (d.suites || []).forEach(walk);
    return { map, stats: d.stats || {} };
  }
  const resultFiles = Object.keys(files).filter(f => /^results.*\.json$/.test(f)).sort();
  const runs = resultFiles.map(f => ({ file: f, ...(pwResults(f) || { map: {}, stats: {} }) }));
  const autoStatus = (c, run) => {
    if (c.status === 'blocked') return 'blocked';
    if (!c.spec) return 'not automated';
    if (!run) return 'automated · not run';
    const r = run.map[c.spec];
    return r ? 'automated · ' + r.status : 'automated · not run';
  };

  // execution.md sections by heading
  const execSections = {};
  (files['execution.md'] || '').split(/^## /m).slice(1).forEach(s => {
    const head = s.split('\n')[0].trim();
    execSections[head] = '## ' + s;
  });

  const tabs = [];
  const add = (name, html) => tabs.push({ name, html });

  // Overview
  (function () {
    const n = cases.length;
    const manual = c => (c.execution || {}).result;
    const mMatch = cases.filter(c => manual(c) === 'match').length;
    const mMis = cases.filter(c => manual(c) === 'mismatch').length;
    let h = '<div class="tiles">';
    h += `<div class="tile"><b>${n}</b><span>test cases</span></div>`;
    h += `<div class="tile"><b>${(spec.acs || []).length}</b><span>acceptance criteria</span></div>`;
    h += `<div class="tile"><b>${mMatch} / ${mMis}</b><span>manual (05): match / mismatch</span></div>`;
    runs.forEach(r => {
      const st = r.stats || {};
      h += `<div class="tile"><b>${st.expected || 0} / ${st.unexpected || 0}</b><span>${esc(r.file)}: passed / failed</span></div>`;
    });
    const filed = issues.filter(i => i.jira && i.jira.key).length;
    h += `<div class="tile"><b>${issues.length} / ${filed}</b><span>issues found / filed in Jira</span></div>`;
    h += '</div>';
    h += '<h2>Gates</h2><table><tr><th>gate</th><th>state</th><th>by</th><th>at</th><th>note</th></tr>';
    ['requirements','plan','cases','manual_check','tests','report_push','issues'].forEach(g => {
      const v = gates[g];
      h += `<tr><td>${g}</td><td>${v ? (v.approved ? pill('approved','ok') : pill('not approved','bad')) : pill('open','neutral')}</td><td>${esc(v && v.by)}</td><td>${esc(v && v.at)}</td><td>${esc(v && v.note)}</td></tr>`;
    });
    h += '</table>';
    h += '<h2>AC coverage</h2><table><tr><th>AC</th><th>text</th><th>cases</th><th>manual (05)</th>';
    runs.forEach(r => h += `<th>${esc(r.file)}</th>`);
    h += '</tr>';
    (spec.acs || []).forEach(ac => {
      const cv = cases.filter(c => (c.covers || []).includes(ac.id));
      const agg = rs => rs.length === 0 ? pill('no case','warn') : rs.some(x => /mismatch|failed|timedOut/.test(x)) ? pill('fail','bad') : rs.every(x => /^(match|passed)$/.test(x)) ? pill('pass','ok') : pill('inconclusive','neutral');
      h += `<tr><td>${esc(ac.id)}</td><td>${esc(ac.text)}</td><td>${cv.map(c => esc(c.id.replace(T + '-', ''))).join(', ')}</td><td>${agg(cv.map(c => (c.execution || {}).result || ''))}</td>`;
      runs.forEach(r => h += `<td>${agg(cv.map(c => (r.map[c.spec] || {}).status || ''))}</td>`);
      h += '</tr>';
    });
    h += '</table>';
    const rep = files['report.md'] || '';
    const sum = rep.split(/^## /m).find(s => s.startsWith('Summary'));
    if (sum) h += md('## ' + sum);
    add('Overview', h);
  })();

  add('Plan', files['plan.md'] ? md(files['plan.md']) : '<p class="note">No plan.md.</p>');

  add('Gates', '<pre>' + esc(files['gates.yaml'] || 'No gates.yaml.') + '</pre>');

  // Spec
  (function () {
    let h = '<h2>Acceptance criteria</h2><table><tr><th>id</th><th>text</th><th>source</th></tr>';
    (spec.acs || []).forEach(a => h += `<tr><td>${esc(a.id)}</td><td>${esc(a.text)}</td><td>${esc(a.source)}</td></tr>`);
    h += '</table>';
    if (spec.launch_codes) {
      h += '<h2>Launch codes</h2><table><tr><th>code</th><th>discount</th><th>minimum order</th><th>status</th></tr>';
      spec.launch_codes.forEach(l => h += `<tr><td>${esc(l.code)}</td><td>${esc(l.discount)}</td><td>${esc(l.minimum_order)}</td><td>${esc(l.status)}</td></tr>`);
      h += '</table>';
    }
    h += '<h2>Out of scope</h2><ul>' + (spec.out_of_scope || []).map(o => `<li>${esc(o)}</li>`).join('') + '</ul>';
    h += '<h2>Questions and answers</h2><table><tr><th>id</th><th>about</th><th>question</th><th>answer</th><th>by</th></tr>';
    (spec.questions || []).forEach(q => h += `<tr><td>${esc(q.id)}</td><td>${esc((q.about || []).join(', '))}</td><td>${esc(q.text)}</td><td><b>${esc(q.answer)}</b></td><td>${esc(q.answered_by)}</td></tr>`);
    h += '</table><h2>Test cases</h2>';
    const last = runs[runs.length - 1];
    cases.forEach(c => {
      h += `<details><summary>${esc(c.id)} · ${esc(c.title)} &nbsp; ${pill(autoStatus(c, last), 'neutral')}</summary>`;
      h += `<p><b>Covers:</b> ${esc((c.covers || []).join(', '))} · <b>Expected from:</b> ${esc(c.expected_source)} · <b>Qase id:</b> ${esc(c.qase_id)}</p>`;
      h += '<ol>' + (c.steps || []).map(s => `<li>${esc(s)}</li>`).join('') + '</ol>';
      h += `<p><b>Expected:</b> ${esc(c.expected)}</p>`;
      if (c.spec) h += `<p><b>Playwright test:</b> <code>${esc(c.spec)}</code></p>`;
      h += '</details>';
    });
    if (!window.jsyaml) h = '<p class="note">js-yaml did not load (offline?), so spec.yaml is shown raw.</p><pre>' + esc(files['spec.yaml'] || '') + '</pre>';
    add('Spec', h);
  })();

  // Results
  (function () {
    let h = '<p class="note">Automation status per case is taken from the last results file (' + esc((runs[runs.length - 1] || {}).file || 'none') + ').</p>';
    h += '<table><tr><th>case</th><th>05 result</th><th>confidence</th><th>human check</th><th>automation</th>';
    runs.forEach(r => h += `<th>${esc(r.file)}</th>`);
    h += '</tr>';
    cases.forEach(c => {
      const e = c.execution || {};
      h += `<tr><td><b>${esc(c.id)}</b><br><span class="note">${esc(c.title)}</span></td><td>${resPill(e.result)}</td><td>${resPill(e.confidence)}</td><td>${esc(c.human_check ? (c.human_check.result || JSON.stringify(c.human_check)) : '')}</td><td>${esc(autoStatus(c, runs[runs.length - 1]))}</td>`;
      runs.forEach(r => {
        const x = r.map[c.spec];
        h += '<td>' + (x ? resPill(x.status) + (x.duration != null ? ` <span class="note">${(x.duration / 1000).toFixed(1)} s</span>` : '') + (x.error ? `<details><summary>error</summary><pre>${esc(x.error.slice(0, 2000))}</pre></details>` : '') : pill('not run', 'neutral')) + '</td>';
      });
      h += '</tr>';
    });
    h += '</table><h2>Manual execution log (execution.md)</h2>';
    cases.forEach(c => {
      if (execSections[c.id]) h += `<details><summary>${esc(c.id)} ${resPill((c.execution || {}).result)}</summary>${md(execSections[c.id])}</details>`;
    });
    Object.keys(execSections).filter(k => !cases.some(c => c.id === k)).forEach(k => h += `<details><summary>${esc(k)}</summary>${md(execSections[k])}</details>`);
    add('Results', h);
  })();

  // Verdicts
  (function () {
    const v = Object.keys(files).filter(f => f.startsWith('verdicts/')).sort();
    let h = '';
    if (!v.length) h = '<p>No judge verdicts in this run. Gate notes:</p><ul>' + ['cases', 'tests'].map(g => `<li><b>${g}:</b> ${esc((gates[g] || {}).note || '—')}</li>`).join('') + '</ul>';
    v.forEach(f => {
      const d = json(files[f]);
      h += `<h2>${esc(f)}</h2>`;
      const checks = d && (d.checks || d.results || []);
      const bad = Array.isArray(checks) ? checks.filter(c => (c.verdict || c.result || '').toUpperCase() !== 'PASS') : [];
      h += bad.length ? '<table><tr><th>check</th><th>verdict</th><th>reason</th></tr>' + bad.map(c => `<tr><td>${esc(c.id || c.check || c.case)}</td><td>${resPill(c.verdict || c.result)}</td><td>${esc(c.reason || c.why || '')}</td></tr>`).join('') + '</table>' : '';
      h += `<details><summary>raw</summary><pre>${esc(files[f])}</pre></details>`;
    });
    add('Verdicts', h);
  })();

  // Issues
  (function () {
    let h = '';
    if (!issues.length) h = '<p>No issues.</p>';
    issues.forEach(i => {
      const key = i.jira && i.jira.key;
      h += `<details open><summary>${esc(i.id)} · ${esc(i.title)}</summary>`;
      h += `<p>${resPill(i.status)} · <b>Priority:</b> ${esc(i.priority)} · <b>Jira:</b> ${key ? `<a href="${esc(i.jira.url)}">${esc(key)}</a>` : '—'} · <b>Decision:</b> ${esc(i.decision && i.decision.by)} at ${esc(i.decision && i.decision.at)}</p>`;
      if (i.priority_reason) h += `<p class="note">${esc(i.priority_reason)}</p>`;
      if (i.steps) h += '<ol>' + [].concat(i.steps).map(s => `<li>${esc(s)}</li>`).join('') + '</ol>';
      if (i.expected) h += `<p><b>Expected:</b> ${esc(i.expected)}</p>`;
      if (i.observed) h += `<p><b>Observed:</b> ${esc(i.observed)} <span class="note">(${esc(i.observed_at)})</span></p>`;
      if (i.jira && i.jira.sprint) h += `<p class="note">Sprint: ${esc(i.jira.sprint)}</p>`;
      h += `<details><summary>raw</summary><pre>${esc(JSON.stringify(i, null, 2))}</pre></details></details>`;
    });
    add('Issues', h);
  })();

  // Report + Files
  add('Report', files['report.md'] ? md(files['report.md']) : '<p class="note">No report.md.</p>');
  add('Files', Object.keys(files).sort().map(f => `<details><summary>${esc(f)}</summary><pre>${esc(files[f])}</pre></details>`).join(''));

  const nav = document.getElementById('nav'), main = document.getElementById('main');
  tabs.forEach((t, i) => {
    const b = document.createElement('button'); b.textContent = t.name;
    const s = document.createElement('section'); s.innerHTML = t.html;
    b.onclick = () => { nav.querySelectorAll('button').forEach(x => x.classList.remove('on')); main.querySelectorAll('section').forEach(x => x.classList.remove('on')); b.classList.add('on'); s.classList.add('on'); };
    nav.appendChild(b); main.appendChild(s);
    if (i === 0) { b.classList.add('on'); s.classList.add('on'); }
  });
})();
</script>
