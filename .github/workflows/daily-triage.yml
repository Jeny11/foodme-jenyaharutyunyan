name: Daily Triage

on:
  schedule:
    - cron: "0 11 * * *"   # 15:00 Yerevan (UTC+4)
  workflow_dispatch:
    inputs:
      since:
        description: "Issues first seen since (ISO date). Empty = last 24h"
        required: false
      max_issues:
        description: "Max issues to triage"
        required: false
        default: "5"

concurrency:
  group: daily-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      TRIAGE_SINCE: ${{ inputs.since }}
      MAX_ISSUES: ${{ inputs.max_issues || '5' }}
      GLITCHTIP_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
      GLITCHTIP_ORGANIZATION: ${{ vars.GLITCHTIP_ORGANIZATION }}
      GRAFANA_MCP_URL: ${{ vars.GRAFANA_MCP_URL }}
      JIRA_URL: ${{ vars.JIRA_URL }}
      JIRA_USERNAME: ${{ vars.JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

    steps:
      # Full history: the code/git triage-worker reads `git log` on main to build the change timeline
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up uv (for the Jira MCP)
        uses: astral-sh/setup-uv@v5

      # The Playwright MCP runs headless on the runner's preinstalled Google Chrome
      # (see .github/mcp-ci.json), so no separate browser download is needed.

      - name: Run daily triage
        id: triage
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the daily-triage skill in unattended mode.
            TRIAGE_SINCE=${{ env.TRIAGE_SINCE }} (empty means the last 24 hours).
            MAX_ISSUES=${{ env.MAX_ISSUES }}.
            In CI the Jira tools are mcp__jira__* (mcp-atlassian), not the claude.ai Atlassian MCP.
            Follow CLAUDE.md: never call /api/debug/boom, never trigger the heartbeat jobs,
            no sleeps, no code changes, never commit or push.
            Write triage-summary.md in the repo root before you finish.
          claude_args: >-
            --mcp-config .github/mcp-ci.json
            --strict-mcp-config
            --allowedTools "Skill,Task,Agent,Read,Write,Edit,Glob,Grep,Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(grep:*),mcp__glitchtip,mcp__grafana,mcp__jira,mcp__playwright"
            --disallowedTools "AskUserQuestion,Bash(git commit:*),Bash(git push:*)"

      # Եթե Claude-ը չհասցրեց ամփոփում գրել, բոտը միևնույն է հաղորդում է
      - name: Make sure there is a summary
        if: always()
        run: |
          if [ ! -s triage-summary.md ]; then
            echo "⛔️ Daily triage $(date -u +%F) failed before writing a summary." > triage-summary.md
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> triage-summary.md
          fi
          cat triage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send summary to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Telegram-ի սահմանը 4096 նիշ է. կտրում ենք ըստ նիշերի, ոչ բայթերի, որ UTF-8-ը (էմոջի) չկոտրվի
          python3 -c 'import sys; t = open("triage-summary.md", encoding="utf-8", errors="replace").read(); sys.stdout.write(t[:3800] + "\n\n🔗 " + sys.argv[1])' "$RUN_URL" > message.txt
          curl -sS --fail "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=$(cat message.txt)" \
            --form-string "disable_web_page_preview=true" > /dev/null

      - name: Upload triage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-${{ github.run_id }}
          path: |
            triage-summary.md
            agentic-workflows/triage/
          if-no-files-found: warn